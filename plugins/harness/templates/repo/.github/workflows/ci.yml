# Harness CI (SPEC REV-1): runs the .claude/harness.json checks on every push and PR.
# The job id/name `ci` is the required status check in the main ruleset (REV-2).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        if: hashFiles('pnpm-lock.yaml') != ''
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install (pnpm)
        if: hashFiles('pnpm-lock.yaml') != ''
        run: pnpm install --frozen-lockfile
      - name: Install (npm)
        if: hashFiles('package-lock.json') != ''
        run: npm ci
      - name: Install (yarn)
        if: hashFiles('yarn.lock') != ''
        run: corepack enable && yarn install --immutable

      - uses: actions/setup-python@v5
        if: hashFiles('pyproject.toml', 'requirements*.txt') != ''
        with:
          python-version: '3.12'
      - name: Install (python)
        if: hashFiles('pyproject.toml', 'requirements*.txt') != ''
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e ".[dev]" || pip install -e .; fi

      - uses: actions/setup-go@v5
        if: hashFiles('go.mod') != ''
        with:
          go-version-file: go.mod

      - name: Harness checks
        run: node .claude/hooks/check.mjs --all --verbose

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        if: hashFiles('pnpm-lock.yaml') != ''
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install (pnpm)
        if: hashFiles('pnpm-lock.yaml') != ''
        run: pnpm install --frozen-lockfile
      - name: Install (npm)
        if: hashFiles('package-lock.json') != ''
        run: npm ci
      - name: Playwright browsers
        if: hashFiles('playwright.config.*') != ''
        run: npx playwright install --with-deps chromium
      - name: e2e (harness.json "e2e", if set)
        run: node .claude/hooks/check.mjs --e2e
